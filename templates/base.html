<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Timbre Escolar{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="{{ url_for('dashboard') }}">
      <i class="bi bi-bell-fill me-2"></i>Timbre Escolar
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
            <i class="bi bi-speedometer2 me-1"></i>Panel
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'event' in request.endpoint %}active{% endif %}" href="{{ url_for('events') }}">
            <i class="bi bi-calendar3 me-1"></i>Eventos
          </a>
        </li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <button id="btn-stop-alarm" class="btn btn-danger px-3 py-2 fw-semibold d-none"
                  title="Detener alarma inmediatamente">
            <i class="bi bi-stop-fill me-1"></i>Detener alarma
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Control global de alarma: muestra/oculta el botón y maneja el stop -->
<script>
const stopBtn = document.getElementById("btn-stop-alarm");

function updatePlayingState() {
  fetch("/api/status")
    .then(r => r.json())
    .then(data => {
      if (data.is_playing) {
        stopBtn.classList.remove("d-none");
      } else {
        stopBtn.classList.add("d-none");
      }
    })
    .catch(() => {});
}

stopBtn.addEventListener("click", function () {
  fetch("/stop-alarm", { method: "POST" })
    .then(r => r.json())
    .then(() => {
      stopBtn.classList.add("d-none");
    });
});

// Polling cada 2 segundos para detectar si hay audio reproduciéndose
setInterval(updatePlayingState, 2000);
updatePlayingState();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
